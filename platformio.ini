[platformio]
default_envs = black_f407zg

[env:black_f407zg]
platform = ststm32@20.0.0
platform_packages = platformio/framework-stm32cubef4@1.28.3
board = black_f407zg
framework = stm32cube
upload_protocol = stlink

; Stage 1 diagnostic only. The default environment remains the working player.
[env:rtos_stage1_smoke]
extends = env:black_f407zg
extra_scripts = pre:scripts/freertos_build.py
build_flags =
    -DRTOS_STAGE1_SMOKE=1
    -mfpu=fpv4-sp-d16
    -mfloat-abi=softfp
monitor_speed = 115200

; Stage 2 bridge: full player loop in PollButtonsTask, two waiting shells.
[env:rtos_stage2_player]
extends = env:black_f407zg
extra_scripts = pre:scripts/freertos_build.py
build_flags =
    -DRTOS_STAGE2_PLAYER=1
    -mfpu=fpv4-sp-d16
    -mfloat-abi=softfp
monitor_speed = 115200

; Stage 3 adds control-state publication; volume and UI tasks remain shells.
[env:rtos_stage3_player]
extends = env:rtos_stage2_player
build_flags =
    ${env:rtos_stage2_player.build_flags}
    -DRTOS_STAGE3_PLAYER=1

; Stage 4: sole runtime volume owner plus codec-bus synchronization.
[env:rtos_stage4_player]
extends = env:rtos_stage3_player
build_flags =
    ${env:rtos_stage3_player.build_flags}
    -DRTOS_STAGE4_PLAYER=1

; Stage 5 completes the control / volume / presentation responsibility split.
[env:rtos_stage5_player]
extends = env:rtos_stage4_player
build_flags =
    ${env:rtos_stage4_player.build_flags}
    -DRTOS_STAGE5_PLAYER=1
    -Wl,--wrap=snprintf
